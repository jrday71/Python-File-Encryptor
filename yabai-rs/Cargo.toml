[package]
name = "yabai-rs"
version = "0.1.0"
edition = "2021"
description = "A fast macOS tiling window manager written in Rust, inspired by AeroSpace"

[[bin]]
name = "yabai-rs"
path = "src/main.rs"

[[bin]]
name = "yabai-rs-msg"
path = "src/bin/msg.rs"

[[bin]]
name = "yabai-rs-menubar"
path = "src/bin/menubar.rs"

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"
objc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
